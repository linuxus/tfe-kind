# Terraform Enterprise Helm Chart Values
# Customized for Kind Kubernetes cluster deployment
# Note: HashiCorp provides TFE as a Helm chart in their official repository

# Global settings
global:
  storageClass: "standard"

# TFE Application Configuration
image:
  repository: "images.releases.hashicorp.com"
  name: "hashicorp/terraform-enterprise"
  tag: "v202410-1"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: "terraform-enterprise"

# Replica count - single instance for dev
replicaCount: 1

# Service configuration
service:
  type: ClusterIP
  port: 443
  targetPort: 443
  annotations: {}

# TFE application settings
tfe:
  hostname: "tfe.localtest.me"
  
  # Operational mode
  operationalMode: "external"
  
  # Metrics
  metrics:
    enabled: true

# Database configuration
database:
  host: "postgres.terraform-enterprise.svc.cluster.local"
  port: 5432
  name: "terraform"
  user: "terraform"
  passwordSecretName: "postgres-credentials"
  passwordSecretKey: "password"
  sslMode: "disable"

# Resources
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# Health checks
livenessProbe:
  enabled: true
  initialDelaySeconds: 300
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Security context
podSecurityContext:
  fsGroup: 1000

# Service account
serviceAccount:
  create: true
  name: "tfe-service-account"

# RBAC
rbac:
  create: true

# Ingress disabled
ingress:
  enabled: false

env:
  variables:
    TFE_HOSTNAME: "tfe.localtest.me"
    TFE_HTTP_PORT: "8080"
    TFE_HTTPS_PORT: "8443"
    TFE_ADMIN_HTTPS_PORT: "8446"
    TFE_DATABASE_HOST: "postgres.terraform-enterprise.svc.cluster.local"
    TFE_DATABASE_NAME: "terraform"
    TFE_DATABASE_USER: "terraform"
    TFE_DATABASE_PARAMETERS: "sslmode=disable"
    TFE_DISK_PATH: "/var/lib/terraform-enterprise"
    TFE_OPERATIONAL_MODE: "external"
    TFE_LOG_LEVEL: "info"
    TFE_VAULT_DISABLE_MLOCK: "true"
    TFE_OBJECT_STORAGE_TYPE: "disk"
    TFE_REDIS_HOST: "redis.terraform-enterprise.svc.cluster.local:6379"
    TFE_REDIS_USE_AUTH: "true"
    TFE_REDIS_SIDEKIQ_HOST: "redis.terraform-enterprise.svc.cluster.local:6379"
    TFE_REDIS_SIDEKIQ_USE_AUTH: "true"
    TFE_RUN_PIPELINE_DRIVER: "docker"
  secretKeyRefs: {}
tls:
  certificateSecret: "tfe-tls"
  certMountPath: "/etc/ssl/private/terraform-enterprise/cert.pem"
  keyMountPath: "/etc/ssl/private/terraform-enterprise/key.pem"

# Extra volumes to mount the TFE data PVC
extraVolumes:
  - name: tfe-data
    persistentVolumeClaim:
      claimName: tfe-data-pvc

# Mount the data volume to the TFE container
extraVolumeMounts:
  - name: tfe-data
    mountPath: /var/lib/terraform-enterprise
