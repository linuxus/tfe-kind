# Terraform Enterprise Helm Chart Values
# Customized for Kind Kubernetes cluster deployment
# Note: HashiCorp provides TFE as a Helm chart in their official repository

# Global settings
global:
  storageClass: "standard"

# TFE Application Configuration
image:
  repository: "images.releases.hashicorp.com"
  name: "hashicorp/terraform-enterprise"
  tag: "1.0.3"
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: "terraform-enterprise"

# Replica count - single instance for dev
replicaCount: 1

# Service configuration
service:
  type: ClusterIP
  annotations: {}

# TFE application settings
tfe:
  hostname: "tfe.localtest.me"
  metrics:
    enabled: true

# Database configuration
database:
  host: "postgres.terraform-enterprise.svc.cluster.local"
  port: 5432
  name: "terraform"
  user: "terraform"
  passwordSecretName: "postgres-credentials"
  passwordSecretKey: "password"
  sslMode: "disable"

# Resources
resources:
  requests:
    cpu: "2"
    memory: "4Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# Health checks
livenessProbe:
  enabled: true
  initialDelaySeconds: 300
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  initialDelaySeconds: 120
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Security context — TFE bootstrap needs capabilities to set up directories
container:
  securityContext:
    capabilities:
      add:
        - CHOWN
        - DAC_OVERRIDE
        - FOWNER
        - SETGID
        - SETUID

securityContext:
  fsGroup: 1000

# Service account
serviceAccount:
  create: true
  name: "tfe-service-account"

# RBAC
rbac:
  create: true

# Ingress disabled
ingress:
  enabled: false

env:
  variables:
    TFE_HOSTNAME: "tfe.localtest.me"
    TFE_HTTP_PORT: "8080"
    TFE_HTTPS_PORT: "8443"
    TFE_ADMIN_HTTPS_PORT: "8446"
    TFE_DATABASE_HOST: "postgres.terraform-enterprise.svc.cluster.local"
    TFE_DATABASE_NAME: "terraform"
    TFE_DATABASE_USER: "terraform"
    TFE_DATABASE_PARAMETERS: "sslmode=disable"
    TFE_LOG_LEVEL: "info"
    TFE_VAULT_DISABLE_MLOCK: "true"
    # Object storage — MinIO as in-cluster S3-compatible store
    TFE_OBJECT_STORAGE_TYPE: "s3"
    TFE_OBJECT_STORAGE_S3_BUCKET: "tfe"
    TFE_OBJECT_STORAGE_S3_REGION: "us-east-1"
    TFE_OBJECT_STORAGE_S3_ENDPOINT: "http://minio.terraform-enterprise.svc.cluster.local:9000"
    TFE_OBJECT_STORAGE_S3_USE_INSTANCE_PROFILE: "false"
    # Redis
    TFE_REDIS_HOST: "redis.terraform-enterprise.svc.cluster.local:6379"
    TFE_REDIS_USE_AUTH: "true"
    TFE_REDIS_SIDEKIQ_HOST: "redis.terraform-enterprise.svc.cluster.local:6379"
    TFE_REDIS_SIDEKIQ_USE_AUTH: "true"
  secretKeyRefs: {}

tls:
  certificateSecret: "tfe-tls"
  certMountPath: "/etc/ssl/private/terraform-enterprise/cert.pem"
  keyMountPath: "/etc/ssl/private/terraform-enterprise/key.pem"

# Init container to prep directories with correct permissions
initContainers:
  - name: prep-dirs
    image: busybox:latest
    command:
      - sh
      - -c
      - |
        mkdir -p /var/cache/tfe-task-worker/terraform
        chown -R 1000:1000 /var/cache/tfe-task-worker
        chmod -R 775 /var/cache/tfe-task-worker
        chmod 1777 /tmp
    securityContext:
      runAsUser: 0
    volumeMounts:
      - name: task-worker-cache
        mountPath: /var/cache/tfe-task-worker
      - name: tmp-dir
        mountPath: /tmp

# Extra volumes
extraVolumes:
  - name: task-worker-cache
    emptyDir: {}
  - name: tmp-dir
    emptyDir: {}

# Extra volume mounts
extraVolumeMounts:
  - name: task-worker-cache
    mountPath: /var/cache/tfe-task-worker
  - name: tmp-dir
    mountPath: /tmp
