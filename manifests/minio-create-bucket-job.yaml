apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: terraform-enterprise
spec:
  backoffLimit: 4
  template:
    metadata:
      labels:
        app: minio-create-bucket
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: root-password
          command:
            - /bin/sh
            - -c
            - |
              # Wait for MinIO to be ready
              until mc alias set myminio http://minio.terraform-enterprise.svc.cluster.local:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
                echo "Waiting for MinIO..."
                sleep 5
              done
              # Create bucket if it doesn't exist
              mc mb --ignore-existing myminio/tfe
              echo "Bucket 'tfe' is ready"
